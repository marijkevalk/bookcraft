[project]
name = "bookcraft"
version = "0.1.0"
description = "Format and analyze manuscripts for publishing (book production toolkit)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Marijke"}]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8.0",
    "python-docx>=1.1",
    "docxtpl>=0.16",
    "playwright>=1.60.0",
    "flask>=3.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
book-formatter = "bookcraft.main:cli"
bookcraft = "bookcraft.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/bookcraft"]
artifacts = ["src/bookcraft/assets/*.docx"]

[tool.hatch.build.targets.wheel.force-include]
"src/bookcraft/assets/template.docx" = "bookcraft/assets/template.docx"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
module = "docxtpl.*"
ignore_missing_imports = true
